services:
  postgres:
    image: postgres:16-alpine
    container_name: seu-politico-db
    environment:
      POSTGRES_DB: seupolitico
      POSTGRES_USER: seupolitico
      POSTGRES_PASSWORD: seupolitico
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seupolitico -d seupolitico"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
